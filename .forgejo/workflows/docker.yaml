name: Container Image

on:
  schedule:
    - cron: '36 0 * * *'
  push:
    branches: [ "trunk" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "trunk" ]
  workflow_dispatch:

env:
  # Use ourselves
  REGISTRY: codeberg.org
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build:
    runs-on: docker-build
    permissions:
      contents: read
      # Doesn't do anything yet
      # https://codeberg.org/forgejo/forgejo/issues/3571
      # packages: write

    steps:
      - name: Checkout repository
        uses: https://data.forgejo.org/actions/checkout@v4

      # qemu is already installed on the host, no action needed

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      - name: Set up Docker Buildx
        id: buildx
        uses: https://github.com/docker/setup-buildx-action@v3.0.0
        with:
          buildkitd-config-inline: |
            # Hephestus is pretty limited
            [worker.oci]
            max-parallelism = 1

      # Login against a Docker registry except on PR
      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: https://github.com/docker/login-action@v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.PAT_USER }}
          password: ${{ secrets.PAT_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata
        id: meta
        uses: https://github.com/docker/metadata-action@v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image with Buildx (don't push on PR)
      - name: Build and push Docker image
        id: build-and-push
        uses: https://github.com/docker/build-push-action@v5.0.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Implicit platforms only builds amd64
          # Python doesn't ship all the images that qemu supports
          # This is the manual intersection of qemu and python
          platforms: linux/amd64,linux/riscv64,linux/ppc64le,linux/s390x,linux/386,linux/arm/v7,linux/arm/v6,linux/arm64/v8
          # Only qemu: linux/amd64/v2,linux/amd64/v3,linux/ppc64,linux/mips64le,linux/mips64,linux/loong64,
          # Buildx reports linux/arm64, but linux/arm64/v8 runs just fine
          # These derive from https://go.dev/doc/install/source#environment
          cache-from: type=gha
          cache-to: type=gha,mode=max
